# SonarQube Configuration for NPM Package Visualizer

# Project identification
sonar.projectKey=louisan42_npm-package-visualizer
sonar.projectName=NPM Package Visualizer
sonar.projectVersion=1.0.0
sonar.organization=louisan42

# Source code configuration
sonar.sources=server/,client/src/
sonar.tests=server/__tests__/,client/src/components/__tests__/,client/src/utils/__tests__/

# Exclusions - exclude from source analysis but NOT from coverage calculation
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.min.js,**/vendor/**
sonar.test.exclusions=**/node_modules/**,**/build/**,**/dist/**

# Language configuration

# Coverage configuration - only exclude setup files from coverage
sonar.coverage.exclusions=**/jest.config.js,**/setupTests.js
sonar.coverage.inclusions=server/**/*.js,client/src/**/*.js,client/src/**/*.jsx

# Code analysis
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript specific settings
sonar.javascript.environments=node,browser,jest
sonar.typescript.tsconfigPath=client/tsconfig.json

# Multiple coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info,client/coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true

# Duplication detection
sonar.cpd.exclusions=**/__tests__/**

# Security hotspots
sonar.security.hotspots.inheritFromParent=true

# Technical debt
sonar.technicalDebt.hoursInDay=8
sonar.technicalDebt.ratingGrid=0.05,0.1,0.2,0.5

# Branch analysis (for pull requests)
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=louisan42/npm-package-visualizer
